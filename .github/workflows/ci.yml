name: HEXKEEP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked --release
  android:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: cargo install cargo-ndk --locked
      - run: scripts/build.sh
      - name: Inspect the Play package
        run: |
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          python3 scripts/verify-play.py --apk artifacts/HEXKEEP-v0.6-PLAY-preview.apk --aab artifacts/HEXKEEP-v0.6-PLAY.aab --bundletool "$RUNNER_TEMP/bundletool.jar" > artifacts/play-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: hexkeep-apks
          path: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/*verification.json
            android/app/build/reports/lint-results-playRelease.*
  play-device:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: hexkeep-apks
          path: artifacts
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install artifacts/artifacts/HEXKEEP-v0.6-PLAY-preview.apk
            adb install artifacts/artifacts/app-play-debug-androidTest.apk
            adb shell am instrument -w -e class game.hexkeep.PlayReleaseTest,game.hexkeep.AdventureTest,game.hexkeep.EveilTest,game.hexkeep.GameplayTest#soloOfflineLifecycle game.hexkeep.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/play-device.txt
            adb pull /sdcard/Android/data/game.hexkeep/files artifacts/device-files
            grep -q 'OK (6 tests)' artifacts/play-device.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-device-report
          path: |
            artifacts/play-device.txt
            artifacts/device-files/
