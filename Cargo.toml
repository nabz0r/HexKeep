[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
[workspace.package]
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
rand = "0.8"
rand_chacha = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
uniffi = "0.29"
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
